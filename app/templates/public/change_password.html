{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/profile.css">
<link rel="stylesheet" href="/static/css/change_password.css">
{% endblock %}

{% block content %}
<main class="profile">
  <h1>Зміна паролю</h1>

  {% if success_message %}
  <div class="notification success">{{ success_message }}</div>
  {% elif error_message %}
  <div class="notification error">{{ error_message }}</div>
  {% endif %}

  <form method="post" class="profile-form">
    {{ csrf_field()|safe }}
    <label for="current_password">Поточний пароль:</label>
    <input type="password" id="current_password" name="current_password" required>

    <label for="new_password">Новий пароль:</label>
    <input type="password" id="new_password" name="new_password" required>

    <label for="confirm_password">Підтвердження нового паролю:</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <div class="form-actions">
      <button type="submit" class="save-btn">Змінити пароль</button>
      <a href="/profile" class="logout-btn">Назад до профілю</a>
    </div>

    <div class="forgot-link">
      <a href="/forgot">Забули пароль?</a>
    </div>
  </form>
</main>
{% endblock %}
