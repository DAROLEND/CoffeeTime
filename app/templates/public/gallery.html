{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="/static/css/gallery.css">{% endblock %}

{% block content %}
<main class="gallery-page">
  <section class="gallery-hero">
    <h1 class="gallery-hero-title">Наша галерея</h1>
    <p class="gallery-hero-sub">Страви, атмосфера та затишок Coffee Time</p>
  </section>

  <div class="gallery-filters">
    <button class="gf-btn active" data-filter="all">Всі <span class="gf-count">{{ photos|length }}</span></button>
    <button class="gf-btn" data-filter="food">Їжа <span class="gf-count">{{ food_count }}</span></button>
    <button class="gf-btn" data-filter="interior">Інтер'єр <span class="gf-count">{{ interior_count }}</span></button>
  </div>

  <div class="gallery-masonry" id="galleryGrid">
    <div class="g-sizer"></div>
    {% for photo in photos %}
    <div class="g-item" data-cat="{{ photo.category.value }}" data-index="{{ loop.index0 }}">
      <div class="g-inner">
        <img src="{{ photo.filename if photo.filename.startswith('http') else '/static/images/gallery/' ~ photo.filename }}" alt="{{ photo.alt }}">
        <div class="g-overlay">
          <svg class="g-zoom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <p class="gallery-empty" id="galleryEmpty" style="display:none">Немає фото у цій категорії</p>
</main>

<div class="lb-overlay" id="lbOverlay" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose" aria-label="Закрити">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Попереднє">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="lb-img-wrap"><img src="" alt="" id="lbImg" class="lb-img"><div class="lb-spinner" id="lbSpinner"></div></div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Наступне">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div class="lb-footer"><span class="lb-counter" id="lbCounter"></span><span class="lb-caption" id="lbCaption"></span></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/vendor/imagesloaded.pkgd.min.js"></script>
<script src="/static/js/vendor/masonry.pkgd.min.js"></script>
<script src="/static/js/gallery.js"></script>
{% endblock %}
