# Coffee Time — FastAPI stack. Run with:
#   docker compose up --build
name: coffeetime-fastapi

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: db          # overrides DB_HOST from .env — always use the db service in Docker
      DB_PORT: "5432"      # overrides DB_PORT from .env — the db service's internal Postgres port
    volumes:
      - images:/app/static/images   # uploaded images survive container restarts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine   # matches the hosted DB's major version (Supabase)
    environment:
      POSTGRES_DB: ${DB_NAME:-coffeetime}
      POSTGRES_USER: ${DB_USER:-coffeetime}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
      # The app container's entrypoint runs `alembic upgrade head`
      # against a fresh DB, which creates the full schema
      # (0001_baseline + the 3 confirmed fixes in 0002_port_fixes) —
      # see MIGRATION_NOTES.md for cutting this over onto an existing
      # production database instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coffeetime} -d ${DB_NAME:-coffeetime}"]
      interval: 5s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - images:/app/static/images
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    # Overrides the image's ENTRYPOINT (which runs `alembic upgrade
    # head`) — only the app service should own schema migrations. This
    # container just runs the reminders job every 15 minutes. The
    # initial sleep gives the app service's own `alembic upgrade head`
    # a head start on a completely fresh DB; a still-in-progress
    # migration on the first tick just means one failed+retried
    # iteration, not a crash loop.
    entrypoint: ["/bin/sh", "-c", "sleep 15; while true; do python cron/send_reminders.py; sleep 900; done"]
    restart: unless-stopped

volumes:
  db_data:
  images:
