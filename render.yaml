# Render Blueprint — deploy Coffee Time (FastAPI) for free.
#
# Auto-deploy on push needs Render's GitHub App to actually have access
# to this repo (Configure it at https://github.com/settings/installations
# -> Render -> "All repositories", or add this repo explicitly under
# "Only select repositories") — otherwise every push needs a manual
# "Deploy latest commit" in the Render dashboard.
#
# What this deploys:
#   - a free Web Service running the existing Dockerfile (uvicorn) — the
#     JSON API under /api plus /static uploads
#   - a free Static Site with the React SPA (frontend/), which proxies
#     /api/* and /static/* to the API through rewrite rules, so the
#     browser only ever talks to one origin: the session cookie stays
#     first-party (SameSite=Lax) and there is no CORS to configure
#   - a Cron Job running cron/send_reminders.py every 15 minutes
# What it does NOT deploy:
#   - the database — bring your own free Postgres (Supabase, Neon, ...).
#     Both services below just connect to it over the network via DB_*.
#     The image's entrypoint (docker/entrypoint.sh) runs `alembic
#     upgrade head` automatically on every boot; against a fresh,
#     empty database that just creates the schema — no manual step
#     needed.

services:
  - type: web
    name: coffeetime-fastapi
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false # the SPA's public origin (the static site below, or its custom domain): LiqPay return/callback URLs and password-reset links are built from it
      - key: FRONTEND_URL
        sync: false # optional: where GET / on the API redirects to (usually the same as APP_URL)
      - key: DB_HOST
        sync: false # e.g. Supabase's db.<project-ref>.supabase.co, or Neon's host
      - key: DB_PORT
        sync: false # 5432 direct, or Supabase's pooler port (6543) if you use that instead
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LIQPAY_PUBLIC_KEY
        sync: false
      - key: LIQPAY_PRIVATE_KEY
        sync: false
      - key: LIQPAY_SANDBOX
        value: "1"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Coffee Time
      - key: SESSION_LIFETIME
        value: "3600"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_PLACE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: media
      - key: CAFE_PHONE
        sync: false
      - key: CAFE_INSTAGRAM
        sync: false
      - key: GA_ID
        sync: false

  # The React SPA. Rewrites run only when no built file matches the path,
  # and in order: API and uploads go to the backend, everything else
  # falls back to index.html for client-side routing.
  - type: web
    name: coffeetime-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://coffeetime.onrender.com/api/* # the API service's URL
      - type: rewrite
        source: /static/*
        destination: https://coffeetime.onrender.com/static/*
      - type: rewrite
        source: /*
        destination: /index.html

  # NOTE: as of writing, Render's free tier covers Web Services; Cron
  # Jobs may require a paid plan on your account — check Render's
  # current pricing page before relying on this. If it turns out not
  # free, drop this block and run cron/send_reminders.py on a free
  # scheduler elsewhere (e.g. GitHub Actions on a schedule, calling a
  # small authenticated endpoint, or cron-job.org hitting one).
  - type: cron
    name: coffeetime-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    schedule: "*/15 * * * *"
    dockerCommand: python cron/send_reminders.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Coffee Time
      - key: CAFE_PHONE
        sync: false
      - key: CAFE_INSTAGRAM
        sync: false
